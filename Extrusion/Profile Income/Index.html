<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultra Aluminium | Profile Income</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-dark: #0d0f14;
            --bg-card: #161b22;
            --bg-inner: #0d1117;
            --accent-green: #4ade80;
            --accent-blue: #38bdf8;
            --text-main: #ffffff;
            --text-muted: #9aa0a6;
            --border-color: #30363d;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #090b0f; color: var(--text-main); line-height: 1.6; padding-bottom: 100px; overflow-x: hidden; width: 100%; }

        /* HEADER */
        .header {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            background: var(--bg-dark); display: flex; align-items: center; padding: 0 20px;
            border-bottom: 1px solid var(--border-color); z-index: 2000; backdrop-filter: blur(10px);
        }
        .menu-btn { background: transparent; border: none; color: #fff; cursor: pointer; font-size: 24px; margin-right: 15px; }
        .company-name { font-size: 1.1rem; font-weight: 700; color: var(--accent-green); letter-spacing: 1px; }

        /* SIDE MENU */
        .side-menu {
            position: fixed; top: 0; left: -280px; width: 280px; height: 100%;
            background: var(--bg-dark); border-right: 1px solid var(--border-color);
            padding: 90px 15px 20px; transition: var(--transition); z-index: 1500;
            overflow-y: auto;
        }
        .side-menu.active { left: 0; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; z-index: 1400; transition: 0.3s; }
        .overlay.active { display: block; }

        .menu-item { color: white; text-decoration: none; display: flex; align-items: center; justify-content: space-between; padding: 15px; cursor: pointer; transition: 0.2s; border-radius: 10px; }
        .menu-item:hover { background: rgba(255,255,255,0.05); }
        
        .dropdown-content { display: none; flex-direction: column; padding-left: 20px; background: rgba(0,0,0,0.2); }
        .dropdown-content.show { display: flex; }
        
        .nested-content { display: none; flex-direction: column; padding-left: 20px; background: rgba(255,255,255,0.02); }
        .nested-content.show { display: flex; }

        .sub-menu-item { color: var(--text-muted); text-decoration: none; padding: 12px; font-size: 0.9rem; display: flex; align-items: center; justify-content: space-between; border-radius: 8px; }
        .sub-menu-item:hover { color: white; }
        .sub-menu-item.active-sub { color: var(--accent-green); font-weight: 600; }
        
        .chevron-icon { transition: transform 0.3s; width: 18px; height: 18px; }
        .chevron-icon.rotate { transform: rotate(180deg); }

        /* CONTAINER & CARDS */
        .container { padding: 90px 15px 20px; display: flex; flex-direction: column; align-items: center; width: 100%; }
        .card { width: 100%; max-width: 850px; background: var(--bg-card); border-radius: 24px; border: 1px solid var(--border-color); padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .inner-frame { width: 100%; min-height: 100px; background: var(--bg-inner); border-radius: 15px; border: 1px dashed #444c56; padding: 12px; display: flex; flex-direction: column; gap: 12px; }

        .data-entry { background: #1c2128; border-radius: 12px; padding: 15px; border-left: 5px solid var(--accent-blue); position: relative; }
        .data-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; font-size: 0.85rem; }
        .data-grid b { display: block; color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase; }

        /* MODAL */
        .modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -45%);
            width: 95%; max-width: 480px; background: var(--bg-card);
            border: 1px solid var(--border-color); border-radius: 28px;
            padding: 25px; z-index: 3000; display: none; opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-height: 90vh; overflow-y: auto;
        }
        .modal.active { display: block; opacity: 1; transform: translate(-50%, -50%); }

        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
        .form-group label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
        .form-group input, .form-group select { padding: 14px; background: var(--bg-inner); border: 1px solid var(--border-color); border-radius: 12px; color: white; outline: none; width: 100%; }

        .length-multi-container { background: var(--bg-inner); padding: 5px; border-radius: 16px; border: 1px solid var(--border-color); }
        .length-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 15px; border-bottom: 1px solid var(--border-color); }
        .l-check { width: 22px; height: 22px; appearance: none; background: #2d333b; border: 2px solid #444c56; border-radius: 6px; position: relative; }
        .l-check:checked { background: var(--accent-green); }
        .l-check:checked::after { content: '✓'; position: absolute; color: #052e16; left: 4px; top: -1px; font-weight: 900; }
        .l-qty-input { width: 80px; padding: 8px; background: #090b0f; border: 1px solid transparent; border-radius: 8px; color: white; opacity: 0.2; pointer-events: none; }
        .length-row:has(.l-check:checked) .l-qty-input { opacity: 1; pointer-events: all; border-color: #444c56; }

        /* BUTTONS */
        .btn { padding: 16px; border-radius: 14px; border: none; font-weight: 800; cursor: pointer; }
        .btn-save { background: var(--accent-blue); color: #082f49; width: 100%; }
        .btn-cancel { background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); flex: 1; }
        .add-main-btn { background: var(--bg-inner); color: var(--accent-blue); border: 1px solid var(--accent-blue); padding: 16px; font-size: 1rem; font-weight: 700; border-radius: 12px; width: 100%; cursor: pointer; }
        .final-submit-btn { width: 100%; max-width: 850px; background: linear-gradient(135deg, #38bdf8, #0284c7); color: white; padding: 18px; font-size: 1.1rem; font-weight: 800; border-radius: 16px; border: none; cursor: pointer; }
        .submit-footer { position: fixed; bottom: 0; left: 0; width: 100%; padding: 20px; background: rgba(13, 15, 20, 0.8); backdrop-filter: blur(15px); border-top: 1px solid var(--border-color); display: flex; justify-content: center; z-index: 1000; }

        .success-overlay { position: fixed; inset: 0; background: rgba(9, 11, 15, 0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 5000; }
        .success-overlay.active { display: flex; }
        .loader { width: 50px; height: 50px; border: 5px solid #1e293b; border-top: 5px solid var(--accent-blue); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .delete-btn { position: absolute; top: 15px; right: 15px; color: #ff6b6b; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <div class="company-name">ULTRA ALUMINIUM</div>
</div>

<div class="side-menu" id="menu">
    <div style="padding: 10px; color: var(--text-muted); font-size: 0.8rem; font-weight: 800;">MAIN MENU</div>
    <a href="../index.html" class="menu-item"><div><i data-lucide="home"></i> Home</div></a>

    <div class="menu-item" onclick="toggleDrop('extrusionDrop', 'extrusionChev')">
        <div style="display:flex; align-items:center; gap:10px;"><i data-lucide="factory"></i> Extrusion</div>
        <i data-lucide="chevron-down" class="chevron-icon" id="extrusionChev"></i>
    </div>
    <div class="dropdown-content" id="extrusionDrop">
        <a href="../Bucket Income/index.html" class="sub-menu-item">• Bucket income</a>
        <a href="../Profile Income/index.html" class="sub-menu-item active-sub">• Profile income</a>
        <a href="../Aging Details/index.html" class="sub-menu-item">• Aging Details</a>
        <a href="../Overview/index.html" class="sub-menu-item">• Overview</a>
    </div>

</div>

<div class="overlay" id="mainOverlay" onclick="closeAll()"></div>

<div class="modal" id="addModal">
    <h2 style="margin-bottom:20px; font-weight: 800;">New Production</h2>
    <form id="profileForm" onsubmit="event.preventDefault(); saveEntry();">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
            <div class="form-group"><label>Profile Name</label><input type="text" id="pName" required></div>
            <div class="form-group"><label>Type</label><select id="pType"><option>ULR</option><option>PRM</option><option>ULR PRM</option></select></div>
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px;">
            <div class="form-group"><label>Die No</label><input type="number" id="dieNo" required></div>
            <div class="form-group"><label>Billet Length</label><input type="number" id="bBatch" required></div>
            <div class="form-group"><label>Billet Qty</label><input type="number" id="bQty" required></div>
        </div>
        <div class="form-group">
            <label>Lengths</label>
            <div class="length-multi-container">
                <div class="length-row"><label><input type="checkbox" id="c365" class="l-check"> 3.65m</label><input type="number" id="q365" class="l-qty-input"></div>
                <div class="length-row"><label><input type="checkbox" id="c610" class="l-check"> 6.10m</label><input type="number" id="q610" class="l-qty-input"></div>
                <div class="length-row"><label><input type="checkbox" id="c650" class="l-check"> 6.50m</label><input type="number" id="q650" class="l-qty-input"></div>
                <div class="length-row"><label><input type="checkbox" id="cOther" class="l-check"> Other</label><input type="number" id="qOther" class="l-qty-input"></div>
                <input type="number" step="0.01" id="otherVal" style="display:none; margin:10px; width:90%;" placeholder="Custom length">
            </div>
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
            <div class="form-group"><label>In (kg)</label><input type="number" step="0.01" id="inW" required oninput="calcYield()"></div>
            <div class="form-group"><label>Out (kg)</label><input type="number" step="0.01" id="outW" required oninput="calcYield()"></div>
        </div>

        <div class="form-group">
                <label>Off Cut (kg)</label>
                <input type="number" step="0.01" id="offCutVal" required>
        </div>

        <div class="form-group"><label>Yield</label><input type="text" id="yld" readonly style="color:var(--accent-green); font-weight:800;"></div>
        <div style="display:flex; gap:12px;"><button type="submit" class="btn btn-save">Add Entry</button><button type="button" class="btn btn-cancel" onclick="closeModal()">Close</button></div>
    </form>
</div>

<div class="container">
    <div class="page-header"><h1>Profile Income</h1></div>
    <div class="card">
        <button class="add-main-btn" onclick="openModal()">+ Add New Entry</button>
        <div class="inner-frame" id="displayArea"><div style="color:var(--text-muted); text-align:center; padding:20px;">No entries yet.</div></div>
    </div>
</div>

<div class="submit-footer"><button class="final-submit-btn" onclick="finalSubmit()">Finalize & Sync to Sheet</button></div>

<div class="success-overlay" id="statusOverlay"><div class="loader"></div><h2 style="color:white; margin-top:20px;">Syncing...</h2></div>

<script>
    lucide.createIcons();
    let sessionData = [];

    // MENU HANDLERS
    function toggleMenu() { document.getElementById("menu").classList.toggle("active"); document.getElementById("mainOverlay").classList.toggle("active"); }
    function toggleDrop(id, chev) { document.getElementById(id).classList.toggle("show"); document.getElementById(chev).classList.toggle("rotate"); }
    function toggleNested(id, chev) { document.getElementById(id).classList.toggle("show"); document.getElementById(chev).classList.toggle("rotate"); }
    function closeAll() { document.getElementById("menu").classList.remove("active"); closeModal(); document.getElementById("mainOverlay").classList.remove("active"); }

    // APP LOGIC
    function openModal() { document.getElementById("profileForm").reset(); document.getElementById("addModal").classList.add("active"); document.getElementById("mainOverlay").classList.add("active"); }
    function closeModal() { document.getElementById("addModal").classList.remove("active"); if(!document.getElementById("menu").classList.contains("active")) document.getElementById("mainOverlay").classList.remove("active"); }
    function calcYield() { const i = parseFloat(document.getElementById('inW').value)||0, o = parseFloat(document.getElementById('outW').value)||0; document.getElementById('yld').value = i > 0 ? ((o/i)*100).toFixed(2)+"%" : ""; }

    document.getElementById('cOther').addEventListener('change', function() { document.getElementById('otherVal').style.display = this.checked ? 'block' : 'none'; });

   function saveEntry() {
    const entry = {
        id: Date.now(),
        profile: document.getElementById('pName').value,
        type: document.getElementById('pType').value,
        dieNo: document.getElementById('dieNo').value,
        billetBatch: document.getElementById('bBatch').value,
        billetQty: document.getElementById('bQty').value,
        qty365: document.getElementById('c365').checked ? document.getElementById('q365').value : "",
        qty610: document.getElementById('c610').checked ? document.getElementById('q610').value : "",
        qty650: document.getElementById('c650').checked ? document.getElementById('q650').value : "",
        otherLen: document.getElementById('cOther').checked ? document.getElementById('otherVal').value : "",
        otherQty: document.getElementById('cOther').checked ? document.getElementById('qOther').value : "",
        input: document.getElementById('inW').value,
        output: document.getElementById('outW').value,
        offCut: document.getElementById('offCutVal').value, // <-- Add this line
        yield: document.getElementById('yld').value
    };
    sessionData.push(entry); 
    render(); 
    closeModal();
    }

    function render() {
    const area = document.getElementById('displayArea'); 
    area.innerHTML = "";
    if(sessionData.length === 0) { 
        area.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding:20px;">No entries yet.</div>'; 
        return; 
    }
    sessionData.forEach(item => {
        const div = document.createElement('div');
        div.className = 'data-entry';
        div.innerHTML = `<i data-lucide="trash-2" class="delete-btn" onclick="remove(${item.id})"></i>
            <div style="font-weight:700; color:var(--accent-blue);">${item.profile} (${item.type})</div>
            <div class="data-grid">
                <div><b>Billet</b>B:${item.billetBatch} | Q:${item.billetQty}</div>
                <div><b>Weights</b>In:${item.input} | Out:${item.output} | Off:${item.offCut}</div> 
            </div>`; // <-- Added | Off:${item.offCut}
        area.appendChild(div);
    });
    lucide.createIcons();
    }

    function remove(id) { sessionData = sessionData.filter(i => i.id !== id); render(); }

   async function finalSubmit() {
    if (sessionData.length === 0) {
        alert("No entries to sync!");
        return;
    }

    // PASTE YOUR NEW URL HERE
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzD2-RRQWLSDBcVlZ2wv6F4GS85InbrZOuegts7PJl9oewMWzrVw5rL4dbsDanDWE6t/exec'; 
    
    const overlay = document.getElementById('statusOverlay');
    const statusText = overlay.querySelector('h2');
    overlay.classList.add('active');

    for (let i = 0; i < sessionData.length; i++) {
        statusText.innerText = `Syncing row ${i + 1} of ${sessionData.length}...`;
        
        try {
            await fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors', // MUST be no-cors for Google Apps Script
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(sessionData[i])
            });
            
            // Wait 1 second between rows to ensure Google processes them
            await new Promise(r => setTimeout(r, 1000)); 
            
        } catch (error) {
            console.error("Error at row " + i, error);
        }
    }

    statusText.innerText = "Sync Complete!";
    setTimeout(() => {
        sessionData = [];
        location.reload();
    }, 1500);
}

    window.onload = () => { toggleDrop('extrusionDrop', 'extrusionChev'); };
</script>
</body>
</html>
