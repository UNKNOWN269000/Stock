<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultra Aluminium | Extrusion</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-dark: #0d0f14;
            --bg-card: #161b22;
            --accent-green: #90ee90;
            --accent-red: #ff4d4d;
            --text-main: #ffffff;
            --text-muted: #9aa0a6;
            --border-color: #30363d;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #090b0f; color: var(--text-main); line-height: 1.6; overflow-x: hidden;
        }

        /* HEADER */
        .header {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            background: rgba(13, 15, 20, 0.85); display: flex; align-items: center; padding: 0 5%;
            border-bottom: 1px solid var(--border-color); z-index: 2000; backdrop-filter: blur(15px);
        }
        .menu-btn { background: transparent; border: none; color: #fff; cursor: pointer; font-size: 24px; margin-right: 15px; }
        .logo-img { height: 45px; width: 45px; margin-right: 12px; border-radius: 50%; border: 2px solid var(--accent-green); object-fit: cover; }
        .company-name { font-size: 1.1rem; font-weight: 800; color: var(--accent-green); letter-spacing: 0.5px; }

        /* SIDE MENU - Focused on Extrusion */
        .side-menu {
            position: fixed; top: 0; left: -320px; width: 300px; height: 100%;
            background: var(--bg-dark); border-right: 1px solid var(--border-color);
            padding: 90px 15px 40px; transition: var(--transition); z-index: 1500; overflow-y: auto;
        }
        .side-menu.active { left: 0; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; z-index: 1400; }
        .overlay.active { display: block; }

        .menu-item {
            color: white; text-decoration: none; display: flex; align-items: center; 
            gap: 12px; padding: 12px 16px; cursor: pointer; border-radius: 12px; margin-bottom: 4px; transition: 0.2s;
        }
        .menu-item:hover { background: rgba(255,255,255,0.05); }
        .menu-item.active-link { color: var(--accent-green); background: rgba(144, 238, 144, 0.1); font-weight: 600; }
        
        .dropdown-content { display: none; flex-direction: column; padding-left: 15px; border-left: 1px solid var(--border-color); margin-left: 24px; }
        .dropdown-content.show { display: flex; }
        .sub-menu-item { color: var(--text-muted); text-decoration: none; padding: 10px 14px; font-size: 0.9rem; display: flex; align-items: center; gap: 10px; border-radius: 8px; }
        .sub-menu-item:hover { color: var(--accent-green); background: rgba(255,255,255,0.03); }

        .chevron-icon { margin-left: auto; transition: transform 0.3s; width: 16px; }
        .chevron-icon.rotate { transform: rotate(180deg); }

        /* CONTENT LAYOUT */
        .container { padding: 110px 5% 40px; display: flex; flex-direction: column; align-items: center; width: 100%; min-height: 100vh; }
        .welcome-card {
            width: 100%; max-width: 1100px; background: linear-gradient(145deg, var(--bg-card), #1c2128);
            border-radius: 24px; border: 1px solid var(--border-color); padding: 50px 30px; text-align: center; margin-bottom: 40px;
        }
        .welcome-card h1 { font-size: clamp(1.8rem, 5vw, 2.5rem); font-weight: 800; background: linear-gradient(to right, #fff, var(--accent-green)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* PULSE ANIMATION */
        .status-badge { display: inline-flex; align-items: center; gap: 8px; padding: 10px 22px; border-radius: 30px; font-size: 0.85rem; font-weight: 700; margin-top: 20px; }
        .status-badge.online { background: rgba(34, 197, 94, 0.1); color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.2); }
        .status-badge.offline { background: rgba(255, 77, 77, 0.1); color: var(--accent-red); border: 1px solid rgba(255, 77, 77, 0.2); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; }
        
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }
        .online .status-dot { background: #2ecc71; animation: pulse 2s infinite; }
        .offline .status-dot { background: var(--accent-red); }

        /* GRID SYSTEM */
        .section-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; width: 100%; max-width: 1100px; }
        .section-header span { color: var(--accent-green); font-size: 0.85rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }
        .section-header .line { height: 1px; flex: 1; background: var(--border-color); }

        .action-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 16px; width: 100%; max-width: 1100px; 
        }
        .action-card {
            background: var(--bg-card); border: 1px solid var(--border-color); padding: 20px; border-radius: 16px;
            text-decoration: none; color: white; display: flex; align-items: center; gap: 15px; transition: var(--transition);
        }
        .action-card:hover { transform: translateY(-5px); border-color: var(--accent-green); background: #1c2128; }
        .icon-box { background: rgba(144, 238, 144, 0.1); padding: 10px; border-radius: 10px; color: var(--accent-green); display: flex; align-items: center; }

        @media (max-width: 600px) {
            .container { padding: 90px 15px 30px; }
            .action-grid { grid-template-columns: 1fr; }
            .side-menu { width: 85%; }
        }
    </style>
</head>
<body>

<div class="header">
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <img src="Src/logo.png" alt="Logo" class="logo-img">
    <div class="company-name">ULTRA ALUMINIUM</div>
</div>

<div class="side-menu" id="menu">
    <a href="index.html" class="menu-item active-link"><i data-lucide="home"></i> Home</a>

    <div class="dropdown-container">
        <div class="menu-item" onclick="toggleDropdown('extrusionSub', this, event)">
            <i data-lucide="factory"></i> Extrusion
            <i data-lucide="chevron-down" class="chevron-icon"></i>
        </div>
        <div class="dropdown-content" id="extrusionSub">
            <a href="Bucket Income/index.html" class="sub-menu-item">Bucket Income</a>
            <a href="Profile Income/index.html" class="sub-menu-item">Profile Income</a>
            <a href="Aging Details/index.html" class="sub-menu-item">Aging Details</a>
            <a href="Overview/index.html" class="sub-menu-item">Overview</a>
        </div>
    </div>
</div>

<div class="overlay" id="mainOverlay" onclick="closeAll()"></div>

<div class="container">
    <div class="welcome-card">
        <h1>Extrusion Portal</h1>
        <p>Production monitoring and inventory tracking for the Extrusion Department.</p>
        <div style="display: flex; justify-content: center;">
            <div id="statusBadge" class="status-badge online">
                <span class="status-dot"></span>
                <span id="statusText">System Online</span>
            </div>
        </div>
    </div>

    <div class="section-header"><span>Extrusion Operations</span><div class="line"></div></div>
    
    <div class="action-grid">
        <a href="Bucket Income/index.html" class="action-card">
            <div class="icon-box"><i data-lucide="container"></i></div>
            <h3>Bucket Income</h3>
        </a>
        <a href="Profile Income/index.html" class="action-card">
            <div class="icon-box"><i data-lucide="bar-chart-3"></i></div>
            <h3>Profile Income</h3>
        </a>
        <a href="Aging Details/index.html" class="action-card">
            <div class="icon-box"><i data-lucide="timer"></i></div>
            <h3>Aging Details</h3>
        </a>
        <a href="Overview/index.html" class="action-card">
            <div class="icon-box"><i data-lucide="eye"></i></div>
            <h3>System Overview</h3>
        </a>
    </div>
</div>

<script>
    lucide.createIcons();

    function updateOnlineStatus() {
        const badge = document.getElementById('statusBadge');
        const text = document.getElementById('statusText');
        if (navigator.onLine) {
            badge.className = 'status-badge online';
            text.textContent = 'System Online';
        } else {
            badge.className = 'status-badge offline';
            text.textContent = 'System Offline';
        }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    function toggleDropdown(id, element, event) {
        if (event) event.stopPropagation();
        const content = document.getElementById(id);
        const chevron = element.querySelector('.chevron-icon');
        if (content) content.classList.toggle('show');
        if (chevron) chevron.classList.toggle('rotate');
    }

    function toggleMenu() { 
        document.getElementById("menu").classList.toggle("active"); 
        document.getElementById("mainOverlay").classList.toggle("active"); 
    }

    function closeAll() { 
        document.getElementById("menu").classList.remove("active"); 
        document.getElementById("mainOverlay").classList.remove("active");
    }
</script>
</body>
</html>
