<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Aluminium | Management</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-dark: #090b0f;
            --bg-card: #161b22;
            --accent-pink: #e690ee;
            --accent-green2: #90ee90;
            --accent-red: #ff4d4d;
            --text-main: #ffffff;
            --border-color: #30363d;
            --accent-green: #e690ee;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* FIX: Changed height to min-height and removed overflow:hidden to prevent clipping */
        body { 
            font-family: -apple-system, sans-serif; 
            background: var(--bg-dark); 
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }

        .header {
            position: sticky; top: 0; width: 100%; height: 70px;
            background: rgba(13, 15, 20, 0.85); display: flex; align-items: center; padding: 0 20px;
            border-bottom: 1px solid var(--border-color); z-index: 2000; backdrop-filter: blur(15px);
        }

        .logo-img {
            height: 45px; width: 45px; margin-right: 12px;
            object-fit: cover; border-radius: 50%;
            border: 2px solid var(--accent-green2);
        }
        .company-name { font-size: 1rem; font-weight: 800; color: var(--accent-green2); }

        /* FIX: Changed width to max-width: 1000px for responsiveness */
        .wrapper { 
            width: 100%; 
            max-width: 1000px; 
            margin: 0 auto; 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            padding: 15px; 
            gap: 10px; 
        }

        .search-bar-box { 
            background: var(--bg-card); 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            display: flex; 
            align-items: center; 
            padding: 0 15px; 
            flex-shrink: 0;
            margin-bottom: 10px;
        }
        
        #searchInput { background: transparent; border: none; color: white; padding: 12px; width: 100%; outline: none; font-size: 1rem; }

        .content-scroll { flex: 1; overflow-y: auto; }
        
        /* FIX: Items now visible by default */
        .bucket-item { 
            background: var(--bg-card); 
            border: 1px solid var(--border-color); 
            padding: 15px; 
            border-radius: 10px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 8px; 
            cursor: pointer; 
        }
        .bucket-id { color: var(--accent-pink); font-weight: 700; }

        .details-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; display: none; margin-bottom: 15px; }
        .profile-group { background: rgba(255,255,255,0.02); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .detail-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 0.8rem; }
        .detail-label { color: #9aa0a6; }
        
        .qty-input-box { margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 10px; }
        .qty-input { width: 100%; background: #000; border: 1px solid var(--border-color); border-radius: 6px; color: white; padding: 10px; font-size: 0.85rem; outline: none; margin: 5px 0 10px; }

        /* FIX: Changed width to 100% */
        .queue-section { 
            min-height: 200px; 
            width: 100%; 
            background: rgba(144, 238, 144, 0.03); 
            border: 1px solid var(--accent-green); 
            padding: 15px; 
            border-radius: 12px; 
            display: flex; 
            flex-direction: column; 
        }
        
        .queue-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .queue-list { flex: 1; overflow-y: auto; }
        .record-item { background: #1a2029; border-radius: 8px; padding: 12px; margin-bottom: 8px; border-left: 4px solid var(--accent-green); display: flex; justify-content: space-between; align-items: center; }
        
        .submit-btn { width: 100%; background: var(--accent-pink); color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: 800; cursor: pointer; margin-top: 10px; }
        .sync-btn { background: var(--accent-green); color: #000; padding: 8px 20px; border-radius: 6px; font-weight: bold; border: none; cursor: pointer; }
        
        .side-menu {
            position: fixed; top: 0; left: -320px; width: 300px; height: 100%;
            background: var(--bg-dark); border-right: 1px solid var(--border-color);
            padding: 90px 15px 40px; transition: var(--transition); z-index: 1500;
            overflow-y: auto;
        }
        .side-menu.active { left: 0; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; z-index: 1400; }
        .overlay.active { display: block; }

        .nested-content {
            display: none; flex-direction: column; padding-left: 15px;
            border-left: 1px dotted var(--border-color); margin-bottom: 5px;
        }
        .nested-content.show { display: flex; }

        .welcome-card h2 {font-size: 1.9rem; margin-bottom: 10px; font-weight: 800; background: linear-gradient(to right, #fff, var(--accent-green)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  
  /* Add this line */
  text-align: center;
}
        .menu-item {
            color: white; text-decoration: none; display: flex; align-items: center; 
            gap: 12px; padding: 12px 16px; cursor: pointer; transition: 0.2s; border-radius: 12px;
            margin-bottom: 4px; font-size: 0.95rem;
        }
        .menu-item:hover { background: rgba(255,255,255,0.05); }
        .sub-menu-item.active-link { color: var(--accent-green); background: rgba(208, 144, 238, 0.1); font-weight: 600; }

         .menu-btn { 
            background: transparent; border: none; color: #fff; cursor: pointer; 
            font-size: 24px; margin-right: 15px; display: flex; align-items: center; 
        }

         .sub-menu-item {
            color: var(--text-muted); text-decoration: none; padding: 10px 14px;
            font-size: 0.9rem; transition: 0.2s; display: flex; align-items: center; gap: 10px; border-radius: 8px;
        }
        .sub-menu-item:hover { color: var(--accent-green); background: rgba(255,255,255,0.03); }
        

        .menu-item { color: white; text-decoration: none; display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; border-radius: 12px; margin-bottom: 4px; }
        .dropdown-content { display: none; flex-direction: column; padding-left: 15px; border-left: 1px solid var(--border-color); margin-left: 24px; }
        .dropdown-content.show { display: flex; }
        .sub-menu-item.active-link { color: var(--accent-green); background: rgba(208, 144, 238, 0.1); font-weight: 600; }
        .sub-menu-item { color: #9aa0a6; text-decoration: none; padding: 10px 14px; font-size: 0.9rem; display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>

<div class="header">
    <button class="menu-btn" onclick="toggleMenu()" style="background:none; border:none; color:white; font-size:24px; cursor:pointer; margin-right:15px;">☰</button>
    <img src="Src/logo.png" alt="Logo" class="logo-img">
    <div class="company-name">ULTRA ALUMINIUM</div>
</div>

<div class="side-menu" id="menu">
    <a href="../index.html" class="menu-item"><i data-lucide="home"></i> Home</a>

    <div class="dropdown-container">
        <div class="menu-item" onclick="toggleDropdown('powderSub', this, event)">
            <i data-lucide="palette"></i> Powder Coat
            <i data-lucide="chevron-down" class="chevron-icon"></i>
        </div>
        <div class="dropdown-content" id="powderSub">
            <a href="index.html" class="sub-menu-item active-link">Mill Finish Transfer Stock</a>
            <a href="#" class="sub-menu-item">Production</a>
            <a href="#" class="sub-menu-item">Pending</a>
            <div class="menu-item" style="font-size: 0.85rem; padding: 10px 14px; color: var(--text-muted);" onclick="toggleDropdown('powderDamage', this, event)">
                <i data-lucide="alert-triangle" style="width:14px"></i> Damage
                <i data-lucide="chevron-down" class="chevron-icon"></i>
            </div>
            <div class="nested-content" id="powderDamage">
                <a href="#" class="sub-menu-item">Re-Powder</a>
                <a href="#" class="sub-menu-item">Scrap</a>
            </div>
            <a href="#" class="sub-menu-item">Overview</a>
        </div>
    </div>
</div>

<div class="overlay" id="mainOverlay" onclick="closeAll()"></div>

<div class="welcome-card">
<h2>Mill Finish To Powder Coat</br> Transfer Stock</h2>
</div>

<div class="wrapper">
    <div class="search-bar-box">
        <i data-lucide="search" style="color: #9aa0a6; width: 20px;"></i>
        <input type="text" id="searchInput" placeholder="Search Bucket Number..." oninput="filterBuckets()">
    </div>

    <div class="content-scroll">
        <div id="bucketDisplay"></div>
        <div id="detailsPanel" class="details-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h2 id="det-bucket-title" style="color:var(--accent-pink);">Bucket</h2>
                <button onclick="closeDetails()" style="background:none; border:none; color:#9aa0a6; cursor:pointer;"><i data-lucide="x"></i></button>
            </div>
            <div id="profilesContainer"></div>
            <button class="submit-btn" onclick="addToQueue()">Add to Queue</button>
        </div>
    </div>

    <div class="queue-section">
        <div class="queue-header">
            <span style="color:var(--accent-green); font-weight:800; font-size:0.8rem;">SUBMITTED RECORDS QUEUE</span>
            <button class="sync-btn" onclick="finalSync()">FINAL SYNC</button>
        </div>
        <div id="queueList" class="queue-list"></div>
    </div>
</div>

<script>
    lucide.createIcons();
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyBZA20HB307KUBaQ0rwRR5f_Kr4Y0CY-gQdwteu3Z0wIEUeyZoM4U019H4JuL_5w5o/exec';
    let allData = [];
    let queue = [];

    async function loadData() {
        try {
            const response = await fetch(scriptURL);
            allData = await response.json();
            renderBuckets();
        } catch (e) { console.error("Load failed:", e); }
    }

    function renderBuckets() {
        const uniqueBuckets = [...new Set(allData.slice(1).map(row => row[0]).filter(b => b))];
        document.getElementById('bucketDisplay').innerHTML = uniqueBuckets.map(num => `
            <div class="bucket-item" data-id="${num}" onclick="showDetails('${num}')">
                <span class="bucket-id">Bucket #${num}</span>
                <i data-lucide="chevron-right" style="width:18px; color:#9aa0a6"></i>
            </div>
        `).join('');
        lucide.createIcons();
    }

    /* FIX: Updated filter logic to show all when empty and only filter when typing */
    function filterBuckets() {
        const input = document.getElementById("searchInput").value.toUpperCase();
        const items = document.getElementsByClassName("bucket-item");
        
        for (let i = 0; i < items.length; i++) {
            const val = items[i].getAttribute('data-id').toUpperCase();
            if (input === "" || val.includes(input)) {
                items[i].style.display = "flex";
            } else {
                items[i].style.display = "none";
            }
        }
    }

    function formatValue(val) {
    if (val === null || val === undefined || val === "" || val === "-") return "-";
    
    // Check if the value is a date/time string
    if (typeof val === 'string' && val.includes('T')) {
        const date = new Date(val);
        if (isNaN(date.getTime())) return val;

        // If it's a date like 1899, it's likely just a TIME value from Sheets
        if (date.getFullYear() === 1899) {
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        
        // Otherwise, return a clean Date string
        return date.toLocaleDateString('en-GB'); // Formats as DD/MM/YYYY
    }
    return val;
    }

    function showDetails(bucketNum) {
        const matchingRows = allData.filter(r => r[0].toString() === bucketNum.toString());
        document.getElementById('bucketDisplay').style.display = 'none';
        document.getElementById('det-bucket-title').innerText = "Bucket #" + bucketNum;
        
        document.getElementById('profilesContainer').innerHTML = matchingRows.map(row => `
            <div class="profile-group" data-profile="${row[5] || 'Unknown'}">
               <div class="detail-row"><span class="detail-label">Extrusion Date</span><span class="detail-value">${formatValue(row[1])}</span></div>
                <div class="detail-row"><span class="detail-label">Shift</span><span class="detail-value">${row[2] || '-'}</span></div>
                <div class="detail-row"><span class="detail-label">Billet Batch</span><span class="detail-value">${row[3] || '-'}</span></div>
                <div class="detail-row"><span class="detail-label">Type</span><span class="detail-value">${row[4] || '-'}</span></div>
                <div class="detail-row"><span class="detail-label">Die Number</span><span class="detail-value">${row[6] || '-'}</span></div>
                <div class="detail-row"><span class="detail-label">Length</span><span class="detail-value">${row[7] || '-'}</span></div>
                <div class="detail-row"><span class="detail-label">Actual Qty</span><span class="detail-value">${row[8] || '-'}</span></div>
                <div class="detail-row"><span class="detail-label">Surface</span><span class="detail-value">${formatValue(row[9])}</span></div>
                <div class="detail-row"><span class="detail-label">Aging Date</span><span class="detail-value">${formatValue(row[10])}</span></div>
                <div class="detail-row"><span class="detail-label">In Time</span><span class="detail-value">${formatValue(row[11])}</span></div>
                <div class="detail-row"><span class="detail-label">Out Time</span><span class="detail-value">${formatValue(row[12])}</span></div>
                <div class="detail-row"><span class="detail-label">Hardness</span><span class="detail-value">${formatValue(row[13])}</span></div>
                
                <div class="qty-input-box">
                    <label style="font-size:0.7rem; color:var(--accent-green)">PRODUCTION QTY</label>
                    <input type="number" class="qty-input prod-qty" placeholder="Enter output...">
                    
                    <label style="font-size:0.7rem; color:var(--accent-green)">PROD. BUCKET NO</label>
                    <input type="number" class="qty-input prod-bucket" placeholder="Enter bucket no...">
                    
                    <label style="font-size:0.7rem; color:var(--accent-green)">DAMAGE</label>
                    <input type="number" class="qty-input prod-damage" placeholder="Enter damage...">
                </div>
            </div>
        `).join('');
        
        document.getElementById('detailsPanel').style.display = 'block';
        lucide.createIcons();
    }

    function closeDetails() {
        document.getElementById('detailsPanel').style.display = 'none';
        document.getElementById('bucketDisplay').style.display = 'block';
    }

    function toggleMenu() {
        document.getElementById("menu").classList.toggle("active");
        document.getElementById("mainOverlay").classList.toggle("active");
    }

    function closeAll() {
        document.getElementById("menu").classList.remove("active");
        document.getElementById("mainOverlay").classList.remove("active");
    }

    function toggleDropdown(id) {
        const content = document.getElementById(id);
        content.classList.toggle('show');
    }

    loadData();
</script>
</body>
</html>
