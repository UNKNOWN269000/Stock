<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultra Aluminium | Production Portal</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-dark: #0d0f14;
            --bg-card: #161b22;
            --bg-inner: #0d1117;
            --accent-green: #4fde4a;
            --accent-red: #f87171;
            --accent-blue: #60a5fa;
            --text-main: #ffffff;
            --text-muted: #9aa0a6;
            --border-color: #30363d;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #090b0f; color: var(--text-main); line-height: 1.6; padding-bottom: 100px; overflow-x: hidden; width: 100%; }

        /* HEADER */
        .header {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            background: var(--bg-dark); display: flex; align-items: center; padding: 0 20px;
            border-bottom: 1px solid var(--border-color); z-index: 2000; backdrop-filter: blur(10px);
        }
        .menu-btn { background: transparent; border: none; color: #fff; cursor: pointer; font-size: 24px; margin-right: 15px; }
        .company-name { font-size: 1.1rem; font-weight: 700; color: var(--accent-green); letter-spacing: 1px; }

        /* SIDE MENU */
        .side-menu {
            position: fixed; top: 0; left: -280px; width: 280px; height: 100%;
            background: var(--bg-dark); border-right: 1px solid var(--border-color);
            padding: 90px 10px 20px; transition: var(--transition); z-index: 1500;
            overflow-y: auto;
        }
        .side-menu.active { left: 0; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; z-index: 1400; }
        .overlay.active { display: block; }

        /* MENU ITEMS */
        .menu-item {
            color: white; text-decoration: none; display: flex; align-items: center; 
            gap: 10px; padding: 12px 15px; cursor: pointer; transition: 0.2s; border-radius: 10px;
            font-size: 0.95rem;
        }
        .menu-item:hover { background: rgba(255,255,255,0.05); }
        .menu-item.active-link { color: var(--accent-green); background: rgba(74, 222, 128, 0.1); }
        
        .dropdown-container { display: flex; flex-direction: column; }
        .dropdown-trigger { justify-content: space-between; }
        .dropdown-content { display: none; flex-direction: column; padding-left: 20px; }
        .dropdown-content.show { display: flex; }

        .nested-trigger { padding: 8px 15px; font-size: 0.85rem; color: var(--text-muted); }
        .nested-content { display: none; flex-direction: column; padding-left: 20px; border-left: 1px solid var(--border-color); margin-left: 15px; }
        .nested-content.show { display: flex; }

        .sub-menu-item {
            color: var(--text-muted); text-decoration: none; padding: 10px 15px;
            font-size: 0.85rem; transition: 0.2s; display: block; border-radius: 8px;
        }
        .sub-menu-item:hover { color: var(--accent-green); background: rgba(255,255,255,0.03); }
        .sub-menu-item.active-sub { color: var(--accent-green); font-weight: 600; background: rgba(74, 222, 128, 0.05); }
        
        .chevron-icon { transition: transform 0.3s; width: 16px; height: 16px; }
        .chevron-icon.rotate { transform: rotate(180deg); }

        /* MAIN UI */
        .container { padding: 90px 15px 20px; display: flex; flex-direction: column; align-items: center; width: 100%; }
        .page-header { text-align: center; margin-bottom: 25px; width: 100%; }
        .page-header h1 { font-size: 1.8rem; margin-bottom: 5px; }
        .page-header h3 { color: var(--text-muted); font-weight: 400; font-size: 0.9rem; }
        
        .card { width: 100%; max-width: 850px; background: var(--bg-card); border-radius: 24px; border: 1px solid var(--border-color); padding: 20px; display: flex; flex-direction: column; gap: 20px; min-height: 200px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .inner-frame { width: 100%; min-height: 100px; background: var(--bg-inner); border-radius: 15px; border: 1px dashed #444c56; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
        
        /* DATA ENTRY CARD */
        .data-entry { 
            background: #1c2128; 
            border-radius: 12px; 
            padding: 15px; 
            border-left: 5px solid var(--accent-green); 
            position: relative; 
            animation: slideIn 0.3s ease; 
        }
        .data-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; font-size: 0.85rem; margin-top: 5px; }
        .data-item b { display: block; color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase; margin-bottom: 2px; }
        .data-item span { color: white; font-weight: 500; word-break: break-all; }
        
        /* TOP RIGHT ACTIONS */
        .entry-actions { 
            position: absolute; 
            top: 10px; 
            right: 10px; 
            display: flex; 
            gap: 8px; 
        }
        .action-icon { 
            background: rgba(255,255,255,0.05); 
            border: 1px solid var(--border-color); 
            color: var(--text-muted); 
            width: 32px; 
            height: 32px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        .edit-icon:hover { color: var(--accent-blue); border-color: var(--accent-blue); background: rgba(96, 165, 250, 0.1); }
        .delete-icon:hover { color: var(--accent-red); border-color: var(--accent-red); background: rgba(248, 113, 113, 0.1); }

        .submit-footer { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(13, 15, 20, 0.9); backdrop-filter: blur(15px); border-top: 1px solid var(--border-color); padding: 20px; display: flex; justify-content: center; z-index: 1000; }
        .final-submit-btn { width: 100%; max-width: 850px; background: linear-gradient(135deg, #4fde4a, #22c55e); color: #064e3b; border: none; padding: 18px; font-size: 1.1rem; font-weight: 800; border-radius: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; transition: 0.3s; box-shadow: 0 4px 20px rgba(74, 222, 128, 0.3); text-transform: uppercase; }
        
        /* MODAL */
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 95%; max-width: 500px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 25px; z-index: 3000; display: none; max-height: 90vh; overflow-y: auto; box-shadow: 0 0 100px rgba(0,0,0,0.8); }
        .modal.active { display: block; animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 15px; }
        .form-group label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
        .form-group input, .form-group select { padding: 12px; background: var(--bg-inner); border: 1px solid var(--border-color); border-radius: 8px; color: white; outline: none; transition: 0.2s; font-size: 16px; }
        
        .btn { padding: 14px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; flex: 1; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-save { background: var(--accent-green); color: #064e3b; }
        .btn-cancel { background: #374151; color: white; }
        
        .add-main-btn { background: var(--bg-inner); color: var(--accent-green); border: 1px solid var(--accent-green); padding: 16px 40px; font-size: 1rem; font-weight: 700; border-radius: 12px; cursor: pointer; align-self: center; transition: 0.2s; width: 100%; }
        
        .success-overlay { position: fixed; inset: 0; background: rgba(9, 11, 15, 0.98); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 5000; text-align: center; padding: 20px; }
        .success-overlay.active { display: flex; }
        
        .search-results { position: absolute; top: 100%; left: 0; right: 0; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; z-index: 100; max-height: 200px; overflow-y: auto; display: none; }
        .search-results div { padding: 10px; cursor: pointer; border-bottom: 1px solid var(--border-color); }
        .search-results div:hover { background: rgba(255,255,255,0.05); color: var(--accent-green); }

        /* LOADING SPINNER */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(6, 78, 59, 0.3);
            border-radius: 50%;
            border-top-color: #064e3b;
            animation: spin 0.8s linear infinite;
        }

        .welcome-card h1 { font-size: 2.0rem; margin-bottom: auto; font-weight: 800; background: linear-gradient(to right, #fff, var(--accent-green)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; }
        .welcome-card h3 { font-size: 1.2rem; margin-bottom: auto; font-weight: 700; background: linear-gradient(to right, #fff, var(--accent-green)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center;}

        .logo-img {
            height: 45px; width: 45px; margin-right: 12px;
            object-fit: cover; border-radius: 50%;
            border: 2px solid var(--accent-green2);
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes modalPop { from { transform: translate(-50%, -45%) scale(0.9); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="header">
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <img src="Src/logo.png" alt="Logo" class="logo-img">
    <div class="company-name">ULTRA ALUMINIUM</div>
</div>

<div class="side-menu" id="menu">
    <div style="padding: 10px; color: var(--text-muted); font-size: 0.75rem; font-weight: 800; letter-spacing: 1px;">MAIN MENU</div>
    
    <a href="../index.html" class="menu-item"><i data-lucide="home"></i> Home</a>
    
    <div class="dropdown-container">
        <div class="menu-item dropdown-trigger active-link" onclick="toggleDrop('extrusionContent', 'exChevron')">
            <div style="display:flex; align-items:center; gap:10px;"><i data-lucide="factory"></i> Extrusion</div>
            <i data-lucide="chevron-down" class="chevron-icon rotate" id="exChevron"></i>
        </div>
        <div class="dropdown-content show" id="extrusionContent">
            <a href="#" class="sub-menu-item active-sub">• Bucket income</a>
            <a href="../Profile Income/index.html" class="sub-menu-item">• Profile income</a>
            <a href="../Aging Details/index.html" class="sub-menu-item">• Aging Details</a>
            <a href="../Overview/index.html" class="sub-menu-item">• Overview</a>
        </div>
    </div>

</div>

<div class="overlay" id="mainOverlay" onclick="closeAll()"></div>

<div class="modal" id="confirmModal">
    <div style="text-align:center; color:var(--accent-green); margin-bottom:15px;"><i data-lucide="upload-cloud" size="48"></i></div>
    <h3 style="text-align:center; margin-bottom:10px;">Ready to Submit?</h3>
    <p style="text-align:center; color:var(--text-muted);" id="confirmMessage"></p>
    <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="btn btn-save" id="confirmSubmitBtn" onclick="executeSubmit()">Yes, Submit</button>
        <button class="btn btn-cancel" id="cancelSubmitBtn" onclick="closeConfirmModal()">Cancel</button>
    </div>
</div>

<div class="modal" id="addModal">
    <h3 id="modalTitle" style="margin-bottom:20px;">Bucket Production Entry</h3>
    <form id="entryForm" onsubmit="event.preventDefault(); saveEntry();">
        <div class="form-group"><label>Bucket No</label><input type="text" id="bucketNo" required></div>
        <div class="form-group"><label>Extrusion Date</label><input type="date" id="extDate" required></div>
        <div class="form-group"><label>Shift</label><select id="shift" onchange="checkShift()" required><option value="" disabled selected>Select Shift</option><option value="Day">Day</option><option value="Night">Night</option><option value="Other">Other</option></select></div>
        <div class="form-group" id="otherShiftGroup" style="display:none;"><label>Specify Shift</label><input type="text" id="otherShiftText"></div>
        <div class="form-group"><label>Billet Batch No</label><input type="number" id="batchNo" required></div>
        <div class="form-group"><label>Type</label><select id="type" required><option value="" disabled selected>Select Type</option><option value="ULR">ULR</option><option value="PRM">PRM</option><option value="ULR PRM">ULR PRM</option></select></div>
        <div class="form-group" style="position:relative;"><label>Profile (Search)</label><input type="text" id="profileSearch" oninput="filterProfiles()" placeholder="Search profiles..." autocomplete="off" required><div class="search-results" id="searchResults"></div></div>
        <div class="form-group"><label>Die No</label><input type="number" id="dieNo" required></div>
        <div class="form-group"><label>Length (m)</label><input type="number" step="0.01" id="length" oninput="calcWeight()" required></div>
        <div class="form-group"><label>Qty</label><input type="number" id="qty" oninput="calcWeight()" required></div>
        <div class="form-group"><label>Unit Weight (kg/m)</label><input type="number" step="0.001" id="unitWeight" oninput="calcWeight()" required></div>
        <div class="form-group checkbox-group" style="flex-direction:row; align-items:center; gap:10px;"><input type="checkbox" id="hasDamage" onchange="toggleDamageField()"><label for="hasDamage" style="margin:0;">Include Damage Quantity?</label></div>
        <div class="form-group" id="damageInputGroup" style="display:none;"><label>Damage Qty</label><input type="number" id="damageQty"></div>
        <div class="form-group"><label>Surface</label><select id="surface" required><option value="" disabled selected>Select Surface</option><option value="AN">AN</option><option value="PC">PC</option><option value="MF">MF</option></select></div>
        <div class="form-group"><label>Bucket Weight (kg)</label><input type="text" id="totalWeight" style="color:var(--accent-green); font-weight:bold;" readonly value="0.00"></div>
        <div style="display:flex; gap:10px; margin-top:10px;"><button type="submit" class="btn btn-save" id="submitBtn">Save Entry</button><button type="button" class="btn btn-cancel" onclick="closeModal()">Cancel</button></div>
    </form>
</div>

<div class="success-overlay" id="successOverlay">
    <div style="background: var(--bg-card); padding: 40px; border-radius: 30px; border: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; gap: 20px;">
        <i data-lucide="check-circle" size="64" style="color: var(--accent-green);"></i>
        <h2 style="color: var(--accent-green);">Submission Successful</h2>
        <p style="color: var(--text-muted);">Production data has been recorded.</p>
    </div>
</div>

<div class="container">
    <div class="welcome-card">
        <h1>Bucket Income</h1>
        <h3>Extrusion Department</h3>
    </div>
    <div class="card">
        <button class="add-main-btn" onclick="openModal()">+ Add New Bucket</button>
        <div class="inner-frame" id="displayArea">
            <div id="noDataText" style="color: var(--text-muted); text-align: center; padding: 20px;">No data recorded for this session.</div>
        </div>
    </div>
</div>

<div class="submit-footer"><button class="final-submit-btn" id="footerSubmitBtn" onclick="finalSubmit()"><i data-lucide="check-circle"></i> Final Submit Production</button></div>

<script>
    lucide.createIcons();

    function toggleMenu() {
        document.getElementById("menu").classList.toggle("active");
        document.getElementById("mainOverlay").classList.toggle("active");
    }

    function toggleDrop(contentId, chevronId) {
        const content = document.getElementById(contentId);
        const chevron = document.getElementById(chevronId);
        if (content.classList.contains('show')) {
            content.classList.remove('show');
            content.style.display = "none";
            chevron.classList.remove('rotate');
        } else {
            content.classList.add('show');
            content.style.display = "flex";
            chevron.classList.add('rotate');
        }
    }

    const profiles = [
  "06 CH 09", "08 CH 09", "09 CH 09", "09 RP 07", "10 CH 09", 
  "10 CR 02", "10 CR 03", "10 CT 01", "10 GB 01", "10 GB 02", 
  "10 MS 03", "10 MS 04", "10 PC 01", "10 PC 02", "10 PC 03", 
  "10 PC 04", "10 PC 05", "10 PC 06", "10 PC 07", "10 PC 08", 
  "10 PC 09", "10 PC 10", "10 PC 11", "10 SC 01", "10 SC 02", 
  "10 SC 03", "10 SC 04", "10 SL 03", "10 SL 05", "10 SL 06", 
  "10 SL 07", "10 SL 08", "100 DO 01", "100 DO 02", "100 DO 03", 
  "100 DO 04", "100 DO 05", "100 DO 06", "100 DO 07", "100 DO 08", 
  "100 DO 09", "100 DO 10", "100 DO 11", "100 DO 12", "100 DO 13", 
  "100 PA 01", "100 PA 02", "100 SD 01 A", "100 SD 01", "100 SD 02 A", 
  "100 SD 02", "100 SD 03 A", "100 SD 03", "100 SD 04", "100 SD 05", 
  "100 SD 06", "100 SD 07", "100 SD 08", "100 SD 09", "100 SD 10", 
  "100 SD 11", "100 SD 12", "100 SD 13", "100 SD 14", "100 SD 15", 
  "100 SD 16", "100 SD 17", "100 SD 18", "100 SD 19", "100 SD 20", 
  "100 SF 01", "100 SF 02", "100 SF 03", "100 SF 04", "100 SF 05", 
  "100 SF 06", "100 SF 07", "100 SF 08", "11 CH 10", "12 AN 12", 
  "12 CH 12", "12 PL 01", "12 RP 10", "12 TU 12", "16 RP 14", 
  "19 AN 12", "19 AN 19", "19 AT 19", "19 PL 01", "19 RP 17", 
  "19 TU 19", "25 AN 25", "25 AT 25", "25 PL 01", "25 PL 03", 
  "25 RP 23", "25 TU 25", "38 AN 38", "38 AT 38", "38 DO 01", 
  "38 DO 02", "38 DO 03", "38 DO 04", "38 TU 25", "38 TU 28", 
  "38 TU 38", "41 CA 01", "41 CA 02", "41 CA 03", "41 CA 04", 
  "41 CA 05", "41 CA 06", "41 CA 07", "41 CA 08", "41 CA 09", 
  "41 CA 13", "50 TU 25", "50 TU 50", "55 SM 01", "55 SM 02", 
  "55 SM 03", "55 SM 05", "55 SM 06", "55 SM 12", "55 SM 13", 
  "60 CA 01", "60 CA 02", "60 CA 03", "70 CA 01", "70 CA 02", 
  "70 CA 21", "70 CA 22", "70 CA 23", "70 CA 24", "70 CA 26", 
  "70 SD 41", "70 SD 42", "70 SD 43", "70 SD 44", "70 SD 45", 
  "70 SD 46", "70 SW 01", "70 SW 02", "70 SW 03", "70 SW 04", 
  "70 SW 05", "70 SW 06", "70 SW 07", "70 SW 08", "70 SW 09", 
  "70 SW 10", "70 SW 11", "70 SW 12", "76 PA 01", "76 PA 02", 
  "76 PA 03", "76 PA 04", "76 PA 05", "76 PA 06", "76 SF 01", 
  "76 SF 02", "76 SF 03", "76 SF 04", "76 SF 05", "76 SF 06", 
  "76 SF 08", "76 SF 09", "76 SF 11", "76 TU 25", "76 TU 38", 
  "76 TU 76", "80 SW 01", "80 SW 02", "80 SW 03", "80 SW 04", 
  "80 SW 05", "80 SW 06", "80 SW 07", "80 SW 08", "80 SW 09", 
  "80 SW 10", "80 SW 11", "80 SW 12", "80 SW 13", "80 SW 14"
 ];
    let sessionData = [];
    let editId = null;

    function resetForm() {
        document.getElementById('entryForm').reset();
        document.getElementById('extDate').valueAsDate = new Date();
        document.getElementById('totalWeight').value = "0.00";
        document.getElementById('otherShiftGroup').style.display = 'none';
        document.getElementById('damageInputGroup').style.display = 'none';
        document.getElementById('modalTitle').innerText = "Bucket Production Entry";
        editId = null;
    }

    function toggleDamageField() {
        const isChecked = document.getElementById('hasDamage').checked;
        document.getElementById('damageInputGroup').style.display = isChecked ? 'block' : 'none';
    }

    function checkShift() {
        const shiftVal = document.getElementById('shift').value;
        document.getElementById('otherShiftGroup').style.display = (shiftVal === 'Other') ? 'block' : 'none';
    }

    function openModal() { resetForm(); document.getElementById("addModal").classList.add("active"); document.getElementById("mainOverlay").classList.add("active"); }
    function closeModal() { document.getElementById("addModal").classList.remove("active"); if (!document.getElementById("menu").classList.contains("active")) document.getElementById("mainOverlay").classList.remove("active"); }
    function closeConfirmModal() { document.getElementById('confirmModal').classList.remove('active'); if (!document.getElementById("menu").classList.contains("active")) document.getElementById("mainOverlay").classList.remove("active"); }
    function closeAll() { document.getElementById("menu").classList.remove("active"); closeModal(); closeConfirmModal(); }

    function calcWeight() {
        const qty = parseFloat(document.getElementById('qty').value) || 0;
        const weight = parseFloat(document.getElementById('unitWeight').value) || 0;
        const length = parseFloat(document.getElementById('length').value) || 0;
        document.getElementById('totalWeight').value = (qty * weight * length).toFixed(2);
    }

    function filterProfiles() {
        const input = document.getElementById('profileSearch').value.toUpperCase();
        const results = document.getElementById('searchResults');
        results.innerHTML = '';
        if(!input) { results.style.display = 'none'; return; }
        const filtered = profiles.filter(p => p.toUpperCase().includes(input));
        if(filtered.length > 0) {
            results.style.display = 'block';
            filtered.forEach(p => {
                const div = document.createElement('div');
                div.innerText = p;
                div.onclick = () => { document.getElementById('profileSearch').value = p; results.style.display = 'none'; };
                results.appendChild(div);
            });
        } else results.style.display = 'none';
    }

    function saveEntry() {
        const shiftVal = document.getElementById('shift').value;
        const formData = {
            id: editId || Date.now(),
            bucket: document.getElementById('bucketNo').value,
            date: document.getElementById('extDate').value,
            shift: shiftVal === 'Other' ? document.getElementById('otherShiftText').value : shiftVal,
            batch: document.getElementById('batchNo').value,
            type: document.getElementById('type').value,
            profile: document.getElementById('profileSearch').value,
            die: document.getElementById('dieNo').value,
            len: document.getElementById('length').value,
            qty: document.getElementById('qty').value,
            uWeight: document.getElementById('unitWeight').value,
            surface: document.getElementById('surface').value,
            totalW: document.getElementById('totalWeight').value,
            damage: document.getElementById('hasDamage').checked ? document.getElementById('damageQty').value : '0'
        };
        if(editId) { 
            const index = sessionData.findIndex(i => i.id === editId); 
            sessionData[index] = formData; 
        } else { 
            sessionData.push(formData); 
        }
        renderEntries(); closeModal();
    }

    function editEntry(id) {
        const item = sessionData.find(i => i.id === id);
        if(!item) return;
        editId = id;
        document.getElementById('modalTitle').innerText = "Edit Entry - Bucket " + item.bucket;
        document.getElementById('bucketNo').value = item.bucket;
        document.getElementById('extDate').value = item.date;
        document.getElementById('batchNo').value = item.batch;
        document.getElementById('type').value = item.type;
        document.getElementById('profileSearch').value = item.profile;
        document.getElementById('dieNo').value = item.die;
        document.getElementById('length').value = item.len;
        document.getElementById('qty').value = item.qty;
        document.getElementById('unitWeight').value = item.uWeight;
        document.getElementById('surface').value = item.surface;
        document.getElementById('totalWeight').value = item.totalW;
        
        const shiftSelect = document.getElementById('shift');
        if(['Day', 'Night'].includes(item.shift)) {
            shiftSelect.value = item.shift;
            document.getElementById('otherShiftGroup').style.display = 'none';
        } else {
            shiftSelect.value = 'Other';
            document.getElementById('otherShiftGroup').style.display = 'block';
            document.getElementById('otherShiftText').value = item.shift;
        }

        const hasDamage = item.damage !== '-';
        document.getElementById('hasDamage').checked = hasDamage;
        document.getElementById('damageInputGroup').style.display = hasDamage ? 'block' : 'none';
        if(hasDamage) document.getElementById('damageQty').value = item.damage;

        document.getElementById("addModal").classList.add("active");
        document.getElementById("mainOverlay").classList.add("active");
    }

    function deleteEntry(id) {
        if(confirm("Delete this bucket entry?")) {
            sessionData = sessionData.filter(i => i.id !== id);
            renderEntries();
        }
    }

    function renderEntries() {
        const display = document.getElementById('displayArea');
        display.innerHTML = '';
        if(sessionData.length === 0) { 
            display.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding:20px;">No data recorded.</div>'; 
            return; 
        }
        [...sessionData].reverse().forEach(item => {
            const entryDiv = document.createElement('div');
            entryDiv.className = 'data-entry';
            entryDiv.innerHTML = `
                <div class="entry-actions">
                    <div class="action-icon edit-icon" onclick="editEntry(${item.id})"><i data-lucide="edit-3" size="16"></i></div>
                    <div class="action-icon delete-icon" onclick="deleteEntry(${item.id})"><i data-lucide="trash-2" size="16"></i></div>
                </div>
                <div class="data-grid">
                    <div class="data-item"><b>Bucket</b><span>${item.bucket}</span></div>
                    <div class="data-item"><b>Date</b><span>${item.date}</span></div>
                    <div class="data-item"><b>Profile</b><span>${item.profile}</span></div>
                    <div class="data-item"><b>Net Weight</b><span style="color:var(--accent-green)">${item.totalW} kg</span></div>
                </div>`;
            display.appendChild(entryDiv);
        });
        lucide.createIcons();
    }

    function finalSubmit() {
        if(sessionData.length === 0) return alert("Add entries first.");
        const totalKg = sessionData.reduce((acc, curr) => acc + parseFloat(curr.totalW), 0).toFixed(2);
        document.getElementById('confirmMessage').innerHTML = `Submit <b>${sessionData.length} buckets</b> (${totalKg} kg)?`;
        document.getElementById('confirmModal').classList.add('active');
        document.getElementById('mainOverlay').classList.add('active');
    }

    async function executeSubmit() {
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw3u7WUdyZCLi6lXc7sbg1RDoGuuZkuZzLzHzoleomYl-EbfbWBXbq_GenbTP5No5Ml/exec";
        const btn = document.getElementById('confirmSubmitBtn');
        const cancelBtn = document.getElementById('cancelSubmitBtn');
        const footerBtn = document.getElementById('footerSubmitBtn');
        
        // Start Animation
        const originalText = btn.innerHTML;
        btn.disabled = true;
        cancelBtn.style.display = 'none';
        btn.innerHTML = '<div class="spinner"></div> Submitting...';
        footerBtn.disabled = true;
        footerBtn.style.opacity = '0.5';

        try {
            const response = await fetch(SCRIPT_URL, { 
                method: 'POST', 
                mode: 'no-cors', // Added for common Apps Script CORS issues
                body: JSON.stringify(sessionData) 
            });
            
            // Note: with 'no-cors', we won't get a proper JSON result, 
            // but we assume success if no error is thrown
            closeConfirmModal();
            document.getElementById('successOverlay').classList.add('active');
            lucide.createIcons();
            setTimeout(() => location.reload(), 2500);

        } catch (error) { 
            alert("Submission failed. Check connection.");
            btn.disabled = false;
            cancelBtn.style.display = 'flex';
            btn.innerHTML = originalText;
            footerBtn.disabled = false;
            footerBtn.style.opacity = '1';
        }
    }
</script>
</body>
</html>
