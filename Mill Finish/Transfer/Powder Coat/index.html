<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bulk Transfer | Ultra Aluminium</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-dark: #080a0c;
            --bg-card: rgba(22, 27, 34, 0.7);
            --accent-green: #4ade80;
            --accent-glow: rgba(74, 222, 128, 0.1);
            --text-main: #ffffff;
            --text-muted: #8b949e;
            --border-color: rgba(48, 54, 61, 0.8);
            --frame-max-width: 1200px;
            --sidebar-width: 280px;
            --top-nav-height: 70px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at top right, #161b22, #080a0c); 
            color: var(--text-main); 
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; 
            padding: calc(var(--top-nav-height) + 20px) 15px 40px;
        }

        /* NAVIGATION & SIDEBAR */
        .top-nav {
            position: fixed; top: 0; left: 0; right: 0;
            height: var(--top-nav-height);
            background: rgba(13, 17, 23, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px; z-index: 2000;
        }

        .sidebar {
            position: fixed; left: calc(var(--sidebar-width) * -1); top: 0;
            width: var(--sidebar-width); height: 100%;
            background: rgba(13, 17, 23, 0.98); backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-color); z-index: 3000;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar.active { left: 0; }

        .sidebar-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            display: none; z-index: 2900; backdrop-filter: blur(4px);
        }
        .sidebar-overlay.active { display: block; }

        /* CARDS & UI */
        .container { width: 100%; max-width: var(--frame-max-width); }
        .search-box { position: relative; margin-bottom: 20px; max-width: 600px; margin: 0 auto 20px; }
        .search-input {
            width: 100%; background: var(--bg-card); border: 2px solid var(--border-color);
            border-radius: 16px; padding: 15px 20px 15px 50px; color: white; outline: none;
        }

        .dropdown-results {
            position: absolute; top: 100%; width: 100%; background: #1c2128; 
            border: 1px solid var(--border-color); border-radius: 12px;
            max-height: 250px; overflow-y: auto; display: none; z-index: 100;
        }
        .dropdown-results.show { display: block; }
        .result-item { padding: 12px 20px; cursor: pointer; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; }

        .entry-card {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 20px; padding: 20px; margin-bottom: 25px; display: none;
        }

        .profile-list-header, .profile-row {
            display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1.2fr;
            padding: 12px 15px; align-items: center;
        }
        .profile-list-header { font-size: 0.65rem; text-transform: uppercase; color: var(--text-muted); font-weight: 800; }
        .profile-row { background: rgba(255,255,255,0.03); border-radius: 12px; margin-bottom: 6px; }

        .qty-input {
            background: #0d1117; border: 1px solid var(--border-color); border-radius: 8px;
            padding: 8px; color: #fff; width: 100%; text-align: center; font-weight: 700;
        }

        .btn-add-bulk { width: 100%; background: #fff; color: #000; padding: 15px; border-radius: 12px; font-weight: 800; cursor: pointer; margin-top: 15px; border:none; }
        .btn-submit { background: var(--accent-green); color: #080a0c; padding: 18px 60px; border-radius: 16px; font-weight: 900; cursor: pointer; border:none; }
        .btn-submit:disabled { opacity: 0.5; }

        .success-overlay {
            position: fixed; inset: 0; background: var(--bg-dark); z-index: 4000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

<header class="top-nav">
    <div class="top-nav-left">
        <button style="background:none; border:none; color:white; cursor:pointer;" onclick="toggleSidebar()">
            <i data-lucide="menu"></i>
        </button>
        <div class="top-nav-logo"><span>ULTRA <span style="color:var(--text-muted)">ALU</span></span></div>
    </div>
    <div class="page-title-badge">Mill Finish</div>
</header>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<nav class="sidebar" id="sidebar">
    <div style="padding: 30px 20px; text-align: center; border-bottom: 1px solid var(--border-color);">
        <h1 style="font-size: 1rem; color:#fff;">ULTRA ADMIN</h1>
    </div>
    <!-- Add your nav links here if needed -->
</nav>

<div class="container">
    <div style="text-align:center; margin-bottom: 25px;">
        <p style="color:var(--accent-green); text-transform:uppercase; font-size:0.7rem; letter-spacing:3px;">Production Unit</p>
        <h2 style="font-size:1.8rem; font-weight:900;">Transfer Powder Coat</h2>
    </div>

    <div class="search-box">
        <input type="text" class="search-input" id="bucketSearch" placeholder="Search Bucket Number..." onkeyup="filterBuckets()">
        <div class="dropdown-results" id="searchResults"></div>
    </div>

    <div class="entry-card" id="entryCard">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px; border-bottom:1px solid var(--border-color); padding-bottom:10px;">
            <div><span style="font-size:0.7rem; color:var(--text-muted)">BUCKET</span><br><span id="activeBucket" style="font-weight:900; color:var(--accent-green)">-</span></div>
            <div style="text-align:right;"><span style="font-size:0.7rem; color:var(--text-muted)">DATE</span><br><span id="activeDate" style="font-weight:600;">-</span></div>
        </div>

        <div class="profile-list-header">
            <span>Profile</span><span>Row ID</span><span>Type</span><span>Len</span><span>Stock</span><span>Transfer</span>
        </div>
        <div id="profileContainer"></div>
        <button class="btn-add-bulk" onclick="addBulkToQueue()">ADD TO QUEUE</button>
    </div>

    <div class="queue-frame" style="background: rgba(0,0,0,0.2); border: 2px dashed var(--border-color); border-radius: 20px; padding: 20px;">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
            <span style="font-size:0.7rem; font-weight:800; color:var(--text-muted)">TRANSFER QUEUE</span>
            <span id="queueCounter" style="color:var(--accent-green); font-weight:900;">0</span>
        </div>
        <div id="queueList"></div>
    </div>

    <div style="margin-top:30px; display:flex; justify-content:center;">
        <button class="btn-submit" id="submitBtn" disabled onclick="finalSubmit()">SUBMIT ALL</button>
    </div>
</div>

<div class="success-overlay" id="successOverlay">
    <i data-lucide="shield-check" size="60" style="color:var(--accent-green)"></i>
    <h2 style="margin-top:15px;">TRANSFER SAVED</h2>
</div>

<script>
    const SHEET_API_URL = "YOUR_SCRIPT_URL_HERE"; 
    let bucketDatabase = [], queue = [];

    window.onload = () => {
        fetchSheetData();
        lucide.createIcons();
        document.getElementById('activeDate').innerText = new Date().toLocaleDateString('en-GB');
    };

    async function fetchSheetData() {
        try {
            const resp = await fetch(SHEET_API_URL);
            bucketDatabase = await resp.json();
        } catch (e) { console.error("Fetch error", e); }
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('sidebarOverlay').classList.toggle('active');
    }

    function filterBuckets() {
        const val = document.getElementById('bucketSearch').value.toUpperCase();
        const res = document.getElementById('searchResults');
        if (!val) { res.classList.remove('show'); return; }

        const uniqueBuckets = [...new Set(bucketDatabase
            .filter(item => item.bucket && item.bucket.toString().includes(val))
            .map(item => item.bucket))];

        res.innerHTML = uniqueBuckets.map(id => `
            <div class="result-item" onclick="loadBucket('${id}')">
                <b>#${id}</b> 
                <span>${bucketDatabase.filter(b => b.bucket === id).length} Items</span>
            </div>
        `).join('');
        res.classList.add('show');
    }

    function loadBucket(id) {
        const profiles = bucketDatabase.filter(b => b.bucket.toString() === id.toString());
        document.getElementById('activeBucket').innerText = "#" + id;
        document.getElementById('profileContainer').innerHTML = profiles.map(p => `
            <div class="profile-row">
                <div style="color:var(--accent-green); font-weight:700;">${p.name}</div>
                <div>${p["row id"]}</div>
                <div>${p.type}</div>
                <div>${p.len}</div>
                <div>${p.qty}</div>
                <div>
                    <input type="number" class="qty-input bulk-qty" 
                        data-bucket="${p.bucket}" data-name="${p.name}" 
                        data-type="${p.type}" data-len="${p.len}" 
                        data-rowid="${p["row id"]}" placeholder="0">
                </div>
            </div>
        `).join('');
        document.getElementById('searchResults').classList.remove('show');
        document.getElementById('entryCard').style.display = 'block';
    }

    function addBulkToQueue() {
        const inputs = document.querySelectorAll('.bulk-qty');
        let added = 0;
        inputs.forEach(inp => {
            const val = parseInt(inp.value);
            if (val > 0) {
                queue.push({
                    id: Date.now() + Math.random(),
                    bucket: inp.dataset.bucket,
                    name: inp.dataset.name,
                    type: inp.dataset.type,
                    len: inp.dataset.len,
                    "row id": inp.dataset.rowid, // MATCHES GS KEY
                    qty: val
                });
                added++;
            }
        });
        if (added) updateUI();
    }

    function updateUI() {
        document.getElementById('queueList').innerHTML = queue.map(item => `
            <div style="background:#1c2128; padding:12px; border-radius:10px; margin-bottom:5px; border:1px solid var(--border-color); display:flex; justify-content:space-between;">
                <span><b>#${item.bucket}</b> | ${item.name}</span>
                <span style="color:var(--accent-green); font-weight:900;">${item.qty}</span>
            </div>
        `).join('');
        document.getElementById('queueCounter').innerText = queue.length;
        document.getElementById('submitBtn').disabled = queue.length === 0;
        document.getElementById('entryCard').style.display = 'none';
        document.getElementById('bucketSearch').value = '';
    }

    async function finalSubmit() {
        const btn = document.getElementById('submitBtn');
        btn.innerText = 'Sending...'; btn.disabled = true;
        try {
            await fetch(SHEET_API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(queue) });
            document.getElementById('successOverlay').style.display = 'flex';
            setTimeout(() => location.reload(), 1500);
        } catch (e) { btn.innerText = 'RETRY'; btn.disabled = false; }
    }
</script>
</body>
</html>
