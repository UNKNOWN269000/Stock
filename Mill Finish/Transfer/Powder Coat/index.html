<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bulk Transfer | Ultra Aluminium</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-dark: #080a0c;
            --bg-card: rgba(22, 27, 34, 0.7);
            --accent-green: #4ade80;
            --accent-glow: rgba(74, 222, 128, 0.1);
            --text-main: #ffffff;
            --text-muted: #8b949e;
            --border-color: rgba(48, 54, 61, 0.8);
            --frame-max-width: 1200px;
            --sidebar-width: 280px;
            --top-nav-height: 70px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at top right, #161b22, #080a0c); 
            color: var(--text-main); 
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; 
            padding: calc(var(--top-nav-height) + 20px) 15px 40px;
            overflow-x: hidden;
        }

        /* TOP NAVIGATION */
        .top-nav {
            position: fixed; top: 0; left: 0; right: 0;
            height: var(--top-nav-height);
            background: rgba(13, 17, 23, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px; z-index: 2000;
        }

        .top-nav-left, .top-nav-right { display: flex; align-items: center; gap: 12px; }
        .top-nav-logo span { font-weight: 800; letter-spacing: 1px; font-size: 1rem; }

        .page-title-badge {
            background: var(--accent-glow);
            border: 1px solid rgba(74, 222, 128, 0.3);
            color: var(--accent-green);
            padding: 5px 12px; border-radius: 20px;
            font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
        }

        /* SIDEBAR */
        .sidebar {
            position: fixed; left: calc(var(--sidebar-width) * -1); top: 0;
            width: var(--sidebar-width); height: 100%;
            background: rgba(13, 17, 23, 0.98); backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-color); z-index: 3000;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }
        .sidebar.active { left: 0; box-shadow: 20px 0 50px rgba(0,0,0,0.5); }

        .sidebar-branding { padding: 30px 20px; text-align: center; border-bottom: 1px solid var(--border-color); }
        .logo-placeholder {
            width: 50px; height: 50px; background: var(--accent-green);
            border-radius: 12px; margin: 0 auto 10px;
            display: flex; align-items: center; justify-content: center; color: #000;
        }

        .menu-heading { padding: 20px 25px 10px; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); font-weight: 700; }
        .nav-item { margin: 2px 12px; }
        .nav-link {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 15px; border-radius: 10px; color: var(--text-muted);
            text-decoration: none; font-size: 0.9rem; transition: 0.2s; cursor: pointer;
        }
        .nav-link:hover, .nav-link.active { background: var(--accent-glow); color: var(--accent-green); }
        .nav-link i { width: 18px; margin-right: 12px; }

        .submenu { display: none; padding-left: 15px; margin-left: 15px; border-left: 1px solid var(--border-color); }
        .submenu.show { display: block; }

        .sidebar-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            display: none; z-index: 2900; backdrop-filter: blur(4px);
        }
        .sidebar-overlay.active { display: block; }

        /* MAIN LAYOUT */
        .container { width: 100%; max-width: var(--frame-max-width); }
        
        .page-header { text-align: center; margin-bottom: 25px; }
        .page-header h2 { font-size: 1.8rem; font-weight: 900; }
        .page-header p { color: var(--accent-green); text-transform: uppercase; font-size: 0.7rem; letter-spacing: 3px; }

        /* SEARCH SECTION */
        .search-box { position: relative; margin-bottom: 20px; max-width: 600px; margin-left: auto; margin-right: auto; }
        .search-input {
            width: 100%; background: var(--bg-card); border: 2px solid var(--border-color);
            border-radius: 16px; padding: 15px 20px 15px 50px; color: white; font-size: 1rem;
            outline: none; transition: 0.3s;
        }
        .search-input:focus { border-color: var(--accent-green); box-shadow: 0 0 15px var(--accent-glow); }
        .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        .dropdown-results {
            position: absolute; top: 100%; width: 100%; background: #1c2128; 
            border: 1px solid var(--border-color); border-radius: 12px;
            max-height: 250px; overflow-y: auto; display: none; z-index: 100; margin-top: 5px;
        }
        .dropdown-results.show { display: block; }
        .result-item { padding: 12px 20px; cursor: pointer; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; }

        /* DATA DISPLAY */
        .entry-card {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 20px; padding: 20px; backdrop-filter: blur(10px);
            margin-bottom: 25px; display: none;
        }

        /* RESPONSIVE TABLE SYSTEM */
        .profile-list-header {
            display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1.2fr;
            padding: 10px 15px; color: var(--text-muted); font-size: 0.65rem; text-transform: uppercase; font-weight: 800;
        }

        .profile-row {
            display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1.2fr;
            align-items: center; padding: 12px 15px; background: rgba(255,255,255,0.03);
            border-radius: 12px; margin-bottom: 6px; border: 1px solid transparent;
        }

        /* MOBILE SPECIFIC OVERRIDES */
        @media (max-width: 600px) {
            body { padding-top: calc(var(--top-nav-height) + 15px); }
            .profile-list-header { display: none; }
            .profile-row {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .p-name { grid-column: span 2; font-size: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; margin-bottom: 5px; }
            .p-label { display: block; font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; }
            .qty-input { height: 45px; font-size: 1.1rem; }
            .btn-submit { width: 100%; padding: 15px; }
            .queue-grid { grid-template-columns: 1fr; }
        }

        @media (min-width: 601px) {
            .p-label { display: none; }
            .queue-grid { grid-template-columns: 1fr 1fr; gap: 15px; }
        }

        .p-name { color: var(--accent-green); font-weight: 700; }
        .qty-input {
            background: #0d1117; border: 1px solid var(--border-color); border-radius: 8px;
            padding: 8px; color: #fff; width: 100%; text-align: center; font-weight: 700; outline: none;
        }
        .qty-input:focus { border-color: var(--accent-green); background: #000; }

        /* QUEUE & BUTTONS */
        .queue-frame { background: rgba(0,0,0,0.2); border: 2px dashed var(--border-color); border-radius: 20px; padding: 20px; }
        .btn-add-bulk {
            width: 100%; background: #fff; color: #000; border: none; padding: 15px;
            border-radius: 12px; font-weight: 800; cursor: pointer; margin-top: 15px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-submit {
            background: var(--accent-green); color: #080a0c; border: none;
            padding: 18px 60px; border-radius: 16px; font-size: 1rem; font-weight: 900;
            cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.3s;
        }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

        .success-overlay {
            position: fixed; inset: 0; background: var(--bg-dark); z-index: 4000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

<header class="top-nav">
    <div class="top-nav-left">
        <button style="background:none; border:none; color:white; cursor:pointer;" onclick="toggleSidebar()">
            <i data-lucide="menu"></i>
        </button>
        <div class="top-nav-logo"><span>ULTRA <span style="color:var(--text-muted)">ALU</span></span></div>
    </div>
    <div class="top-nav-right">
        <div class="page-title-badge">Mill Finish</div>
        <i data-lucide="user" size="20" style="color:var(--accent-green)"></i>
    </div>
</header>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<nav class="sidebar" id="sidebar">
    <div class="sidebar-branding">
        <div class="logo-placeholder"><i data-lucide="factory" size="28"></i></div>
        <h1 style="font-size: 1rem; color:#fff;">ULTRA ADMIN</h1>
    </div>

    <div class="menu-heading">Main Menu</div>
    <div class="nav-item">
        <div class="nav-link active" onclick="toggleSubmenu(this)">
            <span style="display:flex; align-items:center;"><i data-lucide="layers"></i> Mill Finish</span>
            <i data-lucide="chevron-down" size="14"></i>
        </div>
        <div class="submenu show">
            <a href="../../Hardness Check/index.html" class="nav-link">Hardness Check</a>
            <a href="../../Mill finish Profile Stock/index.html" class="nav-link">Profile Stock</a>
            <a href="../../Mill finish Bucket Stock/index.html" class="nav-link">Bucket Stock</a>
            <div class="nav-link" onclick="toggleSubmenu(this)">
                <span>Transfer</span>
                <i data-lucide="chevron-down" size="14"></i>
            </div>
            <div class="submenu show">
                <a href="../../Transfer/Anodizing/index.html" class="nav-link">Anodizing</a>
                <a href="../../Transfer/Powder Coat/index.html" class="nav-link active">Powder Coat</a>
            </div>
            <a href="../../Overview/index.html" class="nav-link">Overview</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <p>Production Unit</p>
        <h2>Transfer Powder Coat</h2>
    </div>

    <div class="search-box">
        <i data-lucide="search" class="search-icon"></i>
        <input type="text" class="search-input" id="bucketSearch" placeholder="Search Bucket Number..." onkeyup="filterBuckets()">
        <div class="dropdown-results" id="searchResults"></div>
    </div>

    <div class="entry-card" id="entryCard">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px; border-bottom:1px solid var(--border-color); padding-bottom:10px;">
            <div>
                <span style="font-size:0.7rem; color:var(--text-muted)">BUCKET</span><br>
                <span id="activeBucket" style="font-weight:900; color:var(--accent-green)">-</span>
            </div>
            <div style="text-align:right;">
                <span style="font-size:0.7rem; color:var(--text-muted)">DATE</span><br>
                <span id="activeDate" style="font-weight:600;">-</span>
            </div>
        </div>

        <div class="profile-list-header">
            <span>Profile</span><span>Row ID</span><span>Type</span><span>Len</span><span>Stock</span><span>Transfer</span>
        </div>

        <div id="profileContainer"></div>

        <button class="btn-add-bulk" onclick="addBulkToQueue()">
            <i data-lucide="plus"></i> ADD TO QUEUE
        </button>
    </div>

    <div class="queue-frame">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
            <span style="font-size:0.7rem; font-weight:800; letter-spacing:1px; color:var(--text-muted)">TRANSFER QUEUE</span>
            <span id="queueCounter" style="color:var(--accent-green); font-weight:900;">0</span>
        </div>
        <div id="queueList" class="queue-grid"></div>
    </div>

    <div style="margin-top:30px; display:flex; justify-content:center;">
        <button class="btn-submit" id="submitBtn" disabled onclick="finalSubmit()">
            <span>SUBMIT ALL</span>
            <i data-lucide="send"></i>
        </button>
    </div>
</div>

<div class="success-overlay" id="successOverlay">
    <i data-lucide="shield-check" size="60" style="color:var(--accent-green)"></i>
    <h2 style="margin-top:15px;">TRANSFER SAVED</h2>
</div>

<script>
    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbyg2L3SASHIwT1ZFmoZ4jEqnQK53H0_AXPDLCLZzW56dyME3K5vI3Wly5fFuPaCA5X6/exec"; 
    let bucketDatabase = [], currentBucket = null, queue = [];

    window.onload = () => {
        fetchSheetData();
        lucide.createIcons();
        const now = new Date();
        document.getElementById('activeDate').innerText = now.toLocaleDateString('en-GB');
    };

    async function fetchSheetData() {
        try {
            const resp = await fetch(SHEET_API_URL);
            bucketDatabase = await resp.json();
        } catch (e) { console.error("Sync Error", e); }
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('sidebarOverlay').classList.toggle('active');
    }

    function toggleSubmenu(el) {
        el.nextElementSibling.classList.toggle('show');
    }

   function filterBuckets() {
        const val = document.getElementById('bucketSearch').value.toUpperCase();
        const res = document.getElementById('searchResults');
        
        if (!val) { 
            res.classList.remove('show'); 
            return; 
        }

        // Get unique bucket IDs that match the search
        const uniqueBuckets = [...new Set(bucketDatabase
            .filter(item => item.bucket.toString().includes(val))
            .map(item => item.bucket))];

            res.innerHTML = uniqueBuckets.map(id => `
            <div class="result-item" onclick="loadBucket('${id}')">
                <b>#${id}</b> 
                <span>${bucketDatabase.filter(b => b.bucket === id).length} Items</span>
            </div>
        `).join('');
        
        res.classList.add('show');
    }

    function loadBucket(id) {
        // Filter the database for all rows matching this bucket ID
        const profiles = bucketDatabase.filter(b => b.bucket === id);
        
        document.getElementById('activeBucket').innerText = "#" + id;
        document.getElementById('profileContainer').innerHTML = profiles.map((p, i) => `
            <div class="profile-row">
                <div class="p-name">${p.name}</div>
                <div><span class="p-label">Row ID</span>${p["row id"]}</div>
                <div><span class="p-label">Type</span>${p.type}</div>
                <div><span class="p-label">Len</span>${p.len}</div>
                <div><span class="p-label">Stock</span>${p.qty}</div>
                <div>
                    <span class="p-label">Transfer Qty</span>
                    <input type="number" class="qty-input bulk-qty" 
                        data-bucket="${p.bucket}" 
                        data-name="${p.name}" 
                        data-type="${p.type}" 
                        data-len="${p.len}" 
                        data-rowid="${p["row id"]}" 
                        placeholder="0">
                </div>
            </div>
        `).join('');
        
        setupEnterKey();
        document.getElementById('searchResults').classList.remove('show');
        document.getElementById('entryCard').style.display = 'block';
        lucide.createIcons();
    }

    function setupEnterKey() {
        const inputs = document.querySelectorAll('.bulk-qty');
        inputs.forEach((inp, i) => {
            inp.onkeydown = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    (i < inputs.length - 1) ? inputs[i+1].focus() : addBulkToQueue();
                }
            };
        });
    }

    function addBulkToQueue() {
        const inputs = document.querySelectorAll('.bulk-qty');
        const date = new Date().toLocaleDateString('en-GB');
        let added = 0;
        inputs.forEach(inp => {
            const val = parseInt(inp.value);
            if (val > 0) {
                const p = currentBucket.profiles[inp.dataset.index];
                queue.push({ id: Date.now()+Math.random(), bucket: currentBucket.id, name: p.name, type: p.type, len: p.len, qty: val, date });
                added++;
            }
        });
        if (added) updateUI();
    }

    function updateUI() {
        document.getElementById('queueList').innerHTML = queue.map(item => `
            <div style="background:#1c2128; padding:12px; border-radius:10px; border:1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center;">
                <div style="font-size:0.8rem;"><b>${item.bucket}</b> | ${item.name}</div>
                <div style="display:flex; align-items:center; gap:12px;">
                    <span style="color:var(--accent-green); font-weight:900;">${item.qty}</span>
                    <i data-lucide="trash-2" size="14" style="color:#ff4d4d; cursor:pointer;" onclick="removeItem(${item.id})"></i>
                </div>
            </div>
        `).join('');
        document.getElementById('queueCounter').innerText = queue.length;
        document.getElementById('submitBtn').disabled = queue.length === 0;
        document.getElementById('entryCard').style.display = 'none';
        document.getElementById('bucketSearch').value = '';
        lucide.createIcons();
    }

    function removeItem(id) { queue = queue.filter(q => q.id !== id); updateUI(); }

    async function finalSubmit() {
        const btn = document.getElementById('submitBtn');
        btn.innerHTML = 'Sending...'; btn.disabled = true;
        try {
            await fetch(SHEET_API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(queue) });
            document.getElementById('successOverlay').style.display = 'flex';
            setTimeout(() => location.reload(), 1500);
        } catch (e) { btn.innerHTML = 'RETRY'; btn.disabled = false; }
    }
</script>
</body>
</html>
