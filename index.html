<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULTRA ALUMINIUM | Portal</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-black: #000000;
            --glass-white: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --input-bg: rgba(255, 255, 255, 0.05);
            --text-white: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.5);
            --gold-glow: #ffd700;
            --gold-shadow: rgba(255, 215, 0, 0.3);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }

        body { 
            background: var(--bg-black);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-white);
            /* Fixed scrolling issue by removing overflow: hidden */
            overflow-y: auto; 
        }

        .brand-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
            flex-shrink: 0;
        }

        .brand-title {
            color: var(--text-white);
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--glass-white);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 45px 35px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            margin-bottom: 20px;
        }

        .avatar-circle {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 35px;
            border: 1px solid var(--glass-border);
            overflow: hidden;
            flex-shrink: 0;
        }

        .logo-img {
            max-width: 90%;
            height: auto;
        }

        .tabs {
            display: flex;
            margin-bottom: 35px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tab {
            flex: 1;
            padding: 12px;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            letter-spacing: 1px;
        }

        .tab.active {
            color: var(--text-white);
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--text-white);
        }

        .input-group {
            margin-bottom: 18px;
        }

        input, select {
            width: 100%;
            height: 55px;
            padding: 0 20px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: var(--input-bg);
            font-size: 16px;
            color: white;
            outline: none;
            transition: var(--transition);
        }

        input:focus, select:focus {
            border-color: var(--gold-glow);
            background: rgba(255, 215, 0, 0.05);
            box-shadow: 0 0 15px var(--gold-shadow), inset 0 0 5px var(--gold-shadow);
        }

        select option {
            background: #1a1a1a;
            color: white;
        }

        .btn {
            width: 100%;
            height: 55px;
            background: var(--text-white);
            border: none;
            border-radius: 14px;
            color: #000;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
            text-transform: uppercase;
        }

        .btn:hover {
            opacity: 0.9;
            transform: scale(0.98);
        }

        .sso-btn {
            width: 100%;
            height: 52px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: white;
            font-weight: 500;
            cursor: pointer;
            margin-top: 25px;
            transition: var(--transition);
        }

        .sso-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--gold-glow);
            color: var(--gold-glow);
        }

        #signup-section, #pending-message {
            display: none;
        }

        @media (max-width: 480px) {
            body { justify-content: flex-start; padding-top: 40px; }
            .container { padding: 35px 20px; }
            .brand-title { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="brand-container">
        <h1 class="brand-title">ULTRA ALUMINIUM</h1>
    </div>

    <div class="container">
        <div class="avatar-circle">
            <img src="Src/logo.png" alt="Ultra Aluminium Logo" class="logo-img">
        </div>

        <div class="tabs">
            <div class="tab active" id="login-tab" onclick="showLogin()">LOGIN</div>
            <div class="tab" id="signup-tab" onclick="showSignup()">SIGN UP</div>
        </div>

        <div id="login-section">
            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <input type="text" id="loginUser" placeholder="Username" required>
                </div>
                <div class="input-group">
                    <input type="password" id="loginPass" placeholder="Password" required>
                </div>
                <button type="submit" class="btn" id="loginBtn">Authenticate</button>
            </form>
        </div>

        <div id="signup-section">
            <div id="signup-form-wrapper">
                <form onsubmit="handleSignUp(event)">
                    <div class="input-group">
                        <input type="text" id="fullName" placeholder="Full Name" required>
                    </div>
                    <div class="input-group">
                        <select id="role" required>
                            <option value="" disabled selected>Department</option>
                            <option value="extrusion">Extrusion</option>
                            <option value="mill">Mill Finish</option>
                            <option value="anodizing">Anodizing</option>
                            <option value="powder">Powder Coat</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <input type="text" id="regUser" placeholder="Username" required>
                    </div>
                    <div class="input-group">
                        <input type="password" id="signupPass" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn">Register</button>
                </form>
            </div>
            <div id="pending-message">
                <p style="color: white; line-height: 1.6;">Access Request Sent.<br>Awaiting approval.</p>
                <button class="btn" style="margin-top: 20px;" onclick="location.reload()">Back</button>
            </div>
        </div>

        <button class="sso-btn">
            <i data-lucide="shield"></i> SSO ACCESS
        </button>
    </div>

    <script>
        lucide.createIcons();

        function showLogin() {
            document.getElementById('login-section').style.display = 'block';
            document.getElementById('signup-section').style.display = 'none';
            document.getElementById('login-tab').classList.add('active');
            document.getElementById('signup-tab').classList.remove('active');
        }

        function showSignup() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('signup-section').style.display = 'block';
            document.getElementById('login-tab').classList.remove('active');
            document.getElementById('signup-tab').classList.add('active');
        }

        const signupURL = 'https://script.google.com/macros/s/AKfycbxEup7dV2OtlQegL5rZ1LGy3Tw5VaPYL-5hU6V2aLe-IjcOQngYsR8FnIZQa38cE6dn/exec';
        const loginURL = 'https://script.google.com/macros/s/AKfycbzRajYF4Vt6iZnnPMK8lp76ssk1kmm6ddGDBIMVJ5YsbJYSpECwpm4dnXVDCEPpPE-A/exec';

        async function handleSignUp(event) {
            event.preventDefault();
            const data = {
                name: document.getElementById('fullName').value,
                role: document.getElementById('role').value,
                username: document.getElementById('regUser').value,
                password: document.getElementById('signupPass').value
            };
            try {
                await fetch(signupURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
                document.getElementById('signup-form-wrapper').style.display = 'none';
                document.getElementById('pending-message').style.display = 'block';
            } catch (e) { alert("System error."); }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.textContent = "VERIFYING...";
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;
            
            try {
                const res = await fetch(`${loginURL}?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`);
                const result = await res.json();
                if (result.status === "success" && result.link && result.link !== "Pending") {
                    window.location.href = result.link;
                } else {
                    alert(result.link === "Pending" ? "Pending admin approval." : "Invalid Credentials.");
                    btn.textContent = "Authenticate";
                }
            } catch (e) { 
                alert("Connection failed."); 
                btn.textContent = "Authenticate"; 
            }
        }
    </script>
</body>
</html>
